[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 `license`/`license-files`
build-backend = "setuptools.build_meta"

[project]
name = "note-color"
version = "0.1.0"
description = "Real-time audio-to-color visualizer -- listens to the microphone, detects the musical note currently being played, and displays a corresponding color."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "pygame-ce>=2.4.1",
    "blessed>=1.20",
    "wcwidth>=0.2",  # terminal_tab_display.py -- display-width-aware cell padding for combining duration glyphs
]

# librosa/music21 are isolated to batch_transcribe.py/rhythm_reanalysis.py
# and score_writer.py respectively (see CLAUDE.md's Key design decisions
# -- "librosa is isolated to..."), neither ever imported by the live/
# Pi-constrained path. Split into this extra so a bare `pip install -e .`
# doesn't pull either onto a Pi-class install that only needs the live
# tools; `pip install -e .[batch]` for `virtualnote transcribe`/
# `--write-score`.
[project.optional-dependencies]
batch = [
    "librosa>=0.10",  # batch_transcribe.py, rhythm_reanalysis.py only -- never imported by the live pipeline (issue #55)
    "music21>=9.1",   # score_writer.py only -- issue #65, MusicXML export (--write-score)
]
# SF2 soundfont playback (map #99, ticket #117, research #102). A separate
# extra, never folded into a pure-Python one: pyfluidsynth is a pure-Python
# ctypes wheel (nothing compiles), but it needs the SYSTEM libfluidsynth
# (Arch `fluidsynth`, Debian `libfluidsynth3`, Homebrew `fluid-synth`) and
# can fail in a way no pure-Python extra can. sf2_playback.py degrades to
# "unavailable" when either half is missing. No soundfont is bundled.
sf2 = [
    "pyfluidsynth>=1.4.0",  # sf2_playback.py only -- pull-model rendering, never Synth.start()
]

# Map #123's offline audio-to-score converter (issues #129/#139). Two
# extras rather than one, because #129 established that solo piano and
# band mix are genuinely two capabilities with different quality stories
# (~0.95 vs ~0.38 onset F1) and very different install costs: #126
# measured the full stack at a 1.1 GB venv plus 81 MB of Demucs weights
# fetched on first use, where transkun alone is a far smaller ask.
#
# Every weight here is permissively licensed and fetched without an
# account -- #139's rules plus the standing "easy install for anyone, not
# just computer geeks" constraint. Nothing gated, nothing non-commercial,
# no Hugging Face token. Demucs' own weights are the one exception and are
# downloaded only after an explicit prompt naming their terms (#139
# category 2), never bundled.
# IMPORTANT, and learned the hard way: install CPU-only torch FIRST.
#
#     pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# `demucs` and `transkun` both depend on `torch`, and plain `pip install
# torch` on Linux resolves to the CUDA build -- which drags in ~2-3 GB of
# NVIDIA CUDA libraries that cannot execute on a machine with no GPU, and
# which map #123's target machine does not have. #126's measured 1.1 GB
# venv figure is the CPU build; the CUDA one is several times that.
#
# A pip extra cannot express an alternative index URL, so this cannot be
# fixed by declaration -- it has to be done before installing the extra,
# or torch has to be reinstalled afterwards from the CPU index.
#
# Second gotcha on the same install: pip unpacks wheels into TMPDIR, and a
# tmpfs /tmp (7.8 GB on the target machine) is too small for torch's
# wheels. Point it at real disk if the install dies with
# "[Errno 122] Disk quota exceeded":
#
#     TMPDIR=~/.cache/pip-tmp pip install -e '.[convert]'
piano = [
    "transkun>=2.0",  # MIT code, MIT weights inside the wheel, CPU by default (0.95 onset F1)
]
# THIRD gotcha, also learned the hard way: `torchaudio` must match
# `torch`'s build. Installing CPU torch first and then this extra pulls
# torchaudio from the DEFAULT index, whose build fails to load its
# compiled extension against a +cpu torch ("Could not load this library:
# _torchaudio.abi3.so"). Install it from the same CPU index:
#
#     pip install --upgrade torchaudio --index-url https://download.pytorch.org/whl/cpu
convert = [
    "transkun>=2.0",
    "demucs>=4.1.0",    # MIT code; weights are research-use-only and prompted for, never bundled
    "beat-this>=1.1.0", # MIT code AND weights -- beats/downbeats (#127/#130)
    "onnxruntime>=1.20", # runs basic-pitch's vendored Apache-2.0 nmp.onnx (#125: the pip package won't install on 3.14)
]

# The subtractive synth's resonant filter is a per-sample IIR recurrence,
# and #103 measured that there is no pure-NumPy substitute for one: a
# scalar Python loop costs 594us/block and the vectorize-across-voices
# escape has a ~5ms floor at *one* voice, 43% of the budget, while
# `scipy.signal.lfilter` with a persistent per-voice `zi` is 54x faster.
# Decision #111 settled that this does not make SciPy a core dependency:
# it lives behind its own extra exactly as librosa/music21 do, isolated
# to synth_engine.py and imported lazily there. Without it the synth
# refuses to *open*, carrying the install line -- never opening
# filterless, which is synthplayer's failure mode and precisely what
# makes the closest prior art read as a toy.
synth = [
    "scipy>=1.10",    # synth_engine.py only -- the SVF filter and pink-noise filter (ticket #113)
]
# VisualNote Studio, the windowed front-end (map #145). PySide6-Essentials
# rather than the full PySide6: the extras (WebEngine, 3D, Charts, Multimedia)
# are a large download this app has no use for. LGPL-3, which #139 permits --
# note PyQt6 is GPL-3-or-commercial and is refused for that reason.
gui = [
    "PySide6-Essentials>=6.6",
]

# Everything. Note this now pulls the converter stack, which is ~1.1 GB
# of CPU torch (#126, measured) -- much larger than the rest of this
# project combined. `[batch,synth,sf2]` remains the light "all the
# tools, none of the neural weights" combination.
all = [
    "note-color[batch,synth,sf2,convert,gui]",
]

[tool.setuptools.package-data]
# The vendored basic-pitch graph (map #123, #129) is data, not code, so it
# needs an explicit rule to survive a non-editable `pip install .`.
# `transcribe_backends.BasicPitchModel._resolve_path()` resolves it relative
# to its own module file, which is why `vendor/` lives beside that module
# inside the package rather than at the repo root. See its README.md for
# provenance and why it is committed at all.
"notecolor.convert.vendor.basic_pitch" = ["*.onnx", "LICENSE", "NOTICE", "README.md"]

[project.scripts]
virtualnote = "notecolor.tui.cli:main"

[tool.setuptools.packages.find]
# src layout with automatic discovery (wayfinder map #145, ticket #146).
# This replaces a hand-maintained 60-entry `py-modules` list, which had
# already silently omitted two modules once (`score_audition`, `tab_playback`
# from tickets #120/#121) and left `pip install .` broken until it was
# noticed. A module can no longer be forgotten by being added in the wrong
# commit -- if it is in the package tree, it ships.
where = ["src"]
